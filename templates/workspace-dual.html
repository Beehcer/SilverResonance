<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>共振 · 多周期计划工作台</title>
  <link rel="stylesheet" href="/static/workspace-dual-shell.css?v=20261113-major">
</head>
<body>
  <main id="stage" aria-label="完整双品种工作台"></main>
  <button id="sidebar-left-toggle" class="sidebar-edge-toggle" type="button" hidden aria-label="展开品种大纲" aria-expanded="false" title="展开品种大纲">›</button>
  <button id="sidebar-right-toggle" class="sidebar-edge-toggle" type="button" hidden aria-label="展开计划和图层" aria-expanded="false" title="展开计划和图层">‹</button>
  <div id="startup" role="status">正在打开完整工作台…</div>
  <div id="drop-shield" hidden></div>
  <div id="drop-guide" hidden role="status"></div>
  <div id="drag-ghost" hidden></div>
  <div id="toast" hidden role="status" aria-live="polite"></div>
  <script src="/static/workspace-dual-model.js?v=20261113-major"></script>
  <script src="/static/workspace-dual-shell.js?v=20261113-major"></script>
